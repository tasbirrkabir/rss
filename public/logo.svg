
    <svg width="368" height="516" viewBox="0 0 368 516" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FF4D4F"/>
          <stop offset="100%" stop-color="#CF1322"/>
        </linearGradient>
      </defs>

      <!-- Outer badge container -->
      <rect x="10" y="10" width="348" height="496" rx="32" fill="#111111" stroke="#F5222D" stroke-width="12"/>

      <!-- Modern Geometric "D" Monogram -->
