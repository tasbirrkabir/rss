        <!-- Inner accent dot / scooter wheel core -->
        <circle cx="115" cy="120" r="22" fill="#F5222D"/>
        <circle cx="115" cy="120" r="10" fill="#FFFFFF"/>
      </g>

      <!-- "DEMO" Pill at bottom -->
